<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keypad Studio</title>
<style>
:root{
  --bg:#f3f4f6;--panel:#ffffff;--panel2:#eceef2;--text:#15171c;--muted:#5b6270;--line:#dcdfe5;
  --accent:#3563e9;--accent-text:#fff;--danger:#c93c3c;--ok:#1f8a4c;--idea:#8a5cf6;
  --body:#1d2025;--cap:#3a3f48;--cap-text:#eceef2;--cap-edge:#4a505a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317;--panel:#191c21;--panel2:#22262d;--text:#e7e9ee;--muted:#9aa1ae;--line:#2b3038;
    --accent:#6d8dff;--accent-text:#0d1020;--danger:#ff6b6b;--ok:#4cc38a;--idea:#b39bff;
    --body:#0b0d10;--cap:#2c3038;--cap-text:#e7e9ee;--cap-edge:#3b414b;
  }
}
:root[data-theme="dark"]{
  --bg:#111317;--panel:#191c21;--panel2:#22262d;--text:#e7e9ee;--muted:#9aa1ae;--line:#2b3038;
  --accent:#6d8dff;--accent-text:#0d1020;--danger:#ff6b6b;--ok:#4cc38a;--idea:#b39bff;
  --body:#0b0d10;--cap:#2c3038;--cap-text:#e7e9ee;--cap-edge:#3b414b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:650;font-size:15px;padding:2px 8px 10px}
.dev{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.plist button.pick{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px}
.nav button:hover,.plist button.pick:hover{background:var(--panel2)}
.nav button[aria-current="true"],.plist li.on button.pick{background:var(--panel2);font-weight:600}
.nav button:focus-visible,.plist button:focus-visible{outline:2px solid var(--accent)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 10px 4px}
.sec small{display:block;text-transform:none;letter-spacing:0;font-size:11px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.plist li{display:flex;align-items:center}
.plist button.pick{flex:1;min-width:0}
.plist .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch{width:12px;height:12px;border-radius:4px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.live{font-size:10px;color:var(--ok);margin-left:auto}
main{padding:22px 26px 40px;min-width:0}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f>span{display:flex;gap:6px;align-items:center}
.f input[type=text],.f input[type=url],.f input[type=password],.f input:not([type]),.f select,.f textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--text);min-width:0;width:100%}
.f textarea{min-height:64px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.f input[type=color]{width:46px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.f input[type=range]{width:100%;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.check b{font-weight:550;display:block}
.check small{color:var(--muted)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.icon{all:unset;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:12px}
.icon:hover{background:var(--panel2);color:var(--text)}
.idea{display:inline-block;font-size:10px;font-weight:600;color:var(--idea);border:1px solid currentColor;border-radius:999px;padding:0 6px;line-height:16px;text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:20px;align-items:start}
.fields{display:grid;gap:12px}
.head{display:grid;grid-template-columns:minmax(140px,1.4fr) auto minmax(120px,1fr) minmax(160px,1.6fr) auto;gap:12px;align-items:end}

/* keypad */
.pad{display:flex;flex-direction:column;align-items:center;gap:10px}
.pad-body{background:var(--body);border-radius:22px;padding:20px;display:grid;
  grid-template-columns:repeat(3,76px) 100px;grid-template-rows:76px 76px;gap:12px;align-items:center;justify-items:center}
.key{all:unset;box-sizing:border-box;cursor:pointer;width:100%;height:100%;border-radius:12px;background:var(--cap);color:var(--cap-text);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6px;gap:2px;
  box-shadow:inset 0 -3px 0 var(--cap-edge),0 0 22px -6px var(--glow);transition:box-shadow .2s}
.key b{font-size:12px;font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.key small{font-size:9px;opacity:.6}
.key[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:3px}
.key:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.knob-wrap{grid-column:4;grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:8px}
.knob{all:unset;cursor:pointer;width:84px;height:84px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 40% 35%,#5b616c,#2a2e35 70%);box-shadow:0 4px 10px rgba(0,0,0,.5),0 0 0 3px #15171b,0 0 24px -6px var(--glow)}
.knob::after{content:"";position:absolute;left:50%;top:8px;width:3px;height:18px;margin-left:-1.5px;border-radius:2px;background:#e9ecf1;
  transform-origin:50% 34px;transform:rotate(var(--rot,0deg))}
.knob[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:4px}
.knob:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.turn{display:flex;gap:4px}
.turn button{all:unset;cursor:pointer;color:#c9ced6;font-size:11px;padding:2px 7px;border-radius:6px;background:#2a2e35}
.turn button:hover{background:#3a3f48}
.readout{font-size:12px;color:var(--muted);text-align:center;min-height:18px}
.meter{height:6px;width:220px;max-width:100%;background:var(--panel2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .15s}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:380px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--text);font-weight:600}
.note{font-size:12px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:8px 10px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
ol.flow{margin:0;padding-left:20px;display:grid;gap:6px}
#osd{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.96);background:rgba(15,17,21,.92);color:#fff;
  padding:16px 26px;border-radius:14px;font-size:18px;font-weight:600;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.18s}
#osd.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast{position:fixed;right:18px;bottom:18px;max-width:min(420px,calc(100vw - 36px));background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}
#toast.show{opacity:1;transform:none}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:18px;width:min(720px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:60vh;overflow:auto;font-size:12px}
.topbar{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}

@media (max-width:900px){
  .grid2{grid-template-columns:1fr}
  .head{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap}
  main{padding:16px}
  .pad-body{grid-template-columns:repeat(3,minmax(0,64px)) 84px;grid-template-rows:64px 64px;padding:14px;gap:8px}
  .knob{width:68px;height:68px}
  .knob::after{transform-origin:50% 26px;height:14px}
  .head{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Keypad Studio</div>
    <div class="dev"><span class="dot"></span><span>HCY-K006 connected <br>0816:246f · prototype data</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="sec">Profiles<small>Knob press cycles in this order</small></div>
    <ul class="plist" id="plist"></ul>
    <button class="btn sm" data-act="addProfile" style="margin:6px 10px">+ New profile</button>
  </aside>
  <main id="main"></main>
</div>
<div id="osd" role="status" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<datalist id="ents-light"><option value="light.desk_lamp"><option value="light.ceiling"><option value="light.led_strip"></datalist>
<datalist id="ents-scene"><option value="scene.movie_night"><option value="scene.focus"><option value="scene.relax"></datalist>
<datalist id="ents-automation"><option value="automation.good_night"><option value="automation.leaving_home"></datalist>
<datalist id="ents-script"><option value="script.coffee_machine"><option value="script.close_blinds"></datalist>
<datalist id="ents-media_player"><option value="media_player.living_room"><option value="media_player.desk_speaker"></datalist>
<datalist id="ents-any"><option value="light.desk_lamp"><option value="light.ceiling"><option value="switch.monitor_plug"><option value="fan.desk_fan"><option value="media_player.living_room"></datalist>

<script>
/* ---------- action catalogue ---------- */
const ent = (domain='any', l='Entity') => ({k:'entity', l, t:'entity', domain});
const ACTIONS = {
  none:          {g:'General',        l:'Do nothing', f:[]},
  ha_light:      {g:'Home Assistant', l:'Set light colour & brightness', f:[ent('light','Light'), {k:'color',l:'Colour',t:'color',d:'#ffb46b'}, {k:'brightness',l:'Brightness',t:'range',min:1,max:100,d:80,unit:'%'}]},
  ha_toggle:     {g:'Home Assistant', l:'Toggle on/off', f:[ent()]},
  ha_scene:      {g:'Home Assistant', l:'Activate scene', f:[ent('scene','Scene')]},
  ha_automation: {g:'Home Assistant', l:'Trigger automation', f:[ent('automation','Automation')]},
  ha_script:     {g:'Home Assistant', l:'Run script', f:[ent('script','Script')]},
  ha_service:    {g:'Home Assistant', l:'Call any service (advanced)', f:[{k:'service',l:'Service',t:'text',ph:'light.turn_on'}, ent(), {k:'data',l:'Extra data (JSON)',t:'textarea',ph:'{"transition": 2}'}]},
  launch:        {g:'PC', l:'Launch application', f:[{k:'path',l:'Program',t:'file',ph:'C:\\Program Files\\App\\app.exe'}, {k:'args',l:'Arguments (optional)',t:'text'}, {k:'focus',l:'If already running, bring it to front',t:'bool',d:true}]},
  url:           {g:'PC', l:'Open website', f:[{k:'url',l:'Address',t:'text',ph:'https://'}]},
  hotkey:        {g:'PC', l:'Send keyboard shortcut', f:[{k:'keys',l:'Shortcut (click, then press keys)',t:'capture'}]},
  text:          {g:'PC', l:'Type text', f:[{k:'text',l:'Text',t:'textarea'}]},
  media:         {g:'PC', l:'Media control', f:[{k:'cmd',l:'Command',t:'select',d:'play_pause',opts:{play_pause:'Play / pause',next:'Next track',prev:'Previous track',mute:'Mute speakers',mic:'Mute microphone'}}]},
  audio_out:     {g:'PC', l:'Switch audio output', idea:true, f:[{k:'device',l:'Cycle between these devices (one per line)',t:'textarea',ph:'Speakers\nHeadphones'}]},
  command:       {g:'PC', l:'Run command', f:[{k:'cmd',l:'PowerShell command',t:'textarea',ph:'Start-Process notepad'}, {k:'hidden',l:'Run without a window',t:'bool',d:true}]},
  profile:       {g:'Keypad', l:'Go to profile', f:[{k:'profile',l:'Profile',t:'profile'}]},
  timer:         {g:'Keypad', l:'Focus timer', idea:true, f:[{k:'minutes',l:'Minutes',t:'range',min:5,max:90,d:25,unit:' min'}]},
};
const KNOB = {
  volume:          {l:'System volume', unit:'%', max:20, sim:'Volume'},
  app_volume:      {l:'One app\u2019s volume', idea:true, unit:'%', max:20, sim:'App volume', f:[{k:'app',l:'App (process name)',t:'text',ph:'Spotify.exe'}]},
  ha_brightness:   {l:'Light brightness', unit:'%', max:25, sim:'Brightness', f:[ent('light','Light')]},
  ha_colortemp:    {l:'Light warmth (colour temperature)', idea:true, unit:'%', max:25, sim:'Warmth', f:[ent('light','Light')]},
  ha_media_volume: {l:'Speaker volume (Home Assistant)', idea:true, unit:'%', max:20, sim:'Speaker', f:[ent('media_player','Speaker')]},
  scroll:          {l:'Mouse scroll', unit:' lines', max:10, sim:'Scroll'},
  zoom:            {l:'Zoom (Ctrl + scroll)', unit:' steps', max:5, sim:'Zoom'},
  keys:            {l:'Custom shortcuts', unit:' presses', max:5, sim:'Shortcut', f:[{k:'cw',l:'Turn right sends',t:'capture'},{k:'ccw',l:'Turn left sends',t:'capture'}]},
};
const LED_MODES = {steady:'Steady', breath:'Breathing', press:'Light on press', tidal:'Wave', off:'Off'};
const KEYMAP = ['F13','F14','F15','F16','F17','F18','F19 (knob press)','F20 (knob right)','F21 (knob left)'];

/* ---------- state ---------- */
const uid = () => Math.random().toString(36).slice(2, 8);
const key = (label, tap) => ({label, tap, hold:{type:'none'}});
const DEFAULT = () => ({
  active: 'desk',
  profiles: [
    {id:'desk', name:'Desk light', color:'#ffb347', led:'steady', apps:'', stateLeds:true,
     knob:{type:'ha_brightness', entity:'light.desk_lamp', step:10, sens:1, accel:false, invert:false},
     keys:[
       key('Warm',       {type:'ha_light', entity:'light.desk_lamp', color:'#ffb46b', brightness:80}),
       key('Daylight',   {type:'ha_light', entity:'light.desk_lamp', color:'#f2f5ff', brightness:100}),
       key('Red',        {type:'ha_light', entity:'light.desk_lamp', color:'#ff3b30', brightness:60}),
       key('On / off',   {type:'ha_toggle', entity:'light.desk_lamp'}),
       key('Movie',      {type:'ha_scene', entity:'scene.movie_night'}),
       key('Good night', {type:'ha_automation', entity:'automation.good_night'}),
     ]},
    {id:'pc', name:'PC', color:'#4f8cff', led:'steady', apps:'', stateLeds:false,
     knob:{type:'volume', step:2, sens:1, accel:true, invert:false},
     keys:[
       key('Browser',    {type:'launch', path:'C:\\Program Files\\Mozilla Firefox\\firefox.exe', args:'', focus:true}),
       key('Spotify',    {type:'launch', path:'%APPDATA%\\Spotify\\Spotify.exe', args:'', focus:true}),
       key('Terminal',   {type:'launch', path:'wt.exe', args:'', focus:true}),
       key('Play/pause', {type:'media', cmd:'play_pause'}),
       key('Mic mute',   {type:'media', cmd:'mic'}),
       key('Snip',       {type:'hotkey', keys:'Win+Shift+S'}),
     ]},
  ],
  ha: {url:'http://homeassistant.local:8123', token:''},
  settings: {startup:true, osd:true, osdPos:'center', dblPrev:false, longPress:'picker', autoSwitch:false, flash:true, sleepLocked:true, ledBrightness:1},
  ideas: {},
});
let S, view = 'profiles', sel = {kind:'key', i:0}, tab = 'tap', sim = {};
try { S = JSON.parse(localStorage.getItem('keypad-studio-v1')) } catch {}
if (!S || !S.profiles) S = DEFAULT();
const save = () => { try { localStorage.setItem('keypad-studio-v1', JSON.stringify({...S, ha:{...S.ha, token:''}})) } catch {} }; // ponytail: token never persisted in the prototype
const P = () => S.profiles.find(p => p.id === S.active) || S.profiles[0];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getPath = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const setPath = (o, p, v) => { const ks = p.split('.'), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); };
let osdT; const osd = p => { if (!S.settings.osd) return; const o = $('#osd'); o.innerHTML = `<span class="swatch" style="background:${esc(p.color)};width:16px;height:16px"></span>${esc(p.name)}`; o.classList.add('show'); clearTimeout(osdT); osdT = setTimeout(() => o.classList.remove('show'), 1200); };
const ideaTag = x => x ? ' <span class="idea">suggested</span>' : '';

function field(f, base) {
  const path = `${base}.${f.k}`, v = getPath(P(), path) ?? f.d ?? '', b = `data-bind="${path}"`;
  const lab = `<span>${esc(f.l)}</span>`;
  switch (f.t) {
    case 'color':   return `<label class="f">${lab}<input type="color" ${b} value="${esc(v)}"></label>`;
    case 'range':   return `<label class="f"><span>${esc(f.l)}: <output>${esc(v)}${f.unit||''}</output></span><input type="range" ${b} min="${f.min}" max="${f.max}" value="${esc(v)}" data-unit="${f.unit||''}"></label>`;
    case 'bool':    return `<label class="check"><input type="checkbox" ${b} ${v ? 'checked' : ''}><b>${esc(f.l)}</b></label>`;
    case 'textarea':return `<label class="f">${lab}<textarea ${b} placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></label>`;
    case 'select':  return `<label class="f">${lab}<select ${b}>${Object.entries(f.opts).map(([k, t]) => `<option value="${k}" ${k===v?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
    case 'profile': return `<label class="f">${lab}<select ${b}>${S.profiles.map(p => `<option value="${p.id}" ${p.id===v?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`;
    case 'entity':  return `<label class="f">${lab}<input ${b} list="ents-${f.domain}" value="${esc(v)}" placeholder="${f.domain==='any'?'light.desk_lamp':f.domain+'.…'}"></label>`;
    case 'capture': return `<label class="f">${lab}<input ${b} data-capture value="${esc(v)}" placeholder="Click here, then press the shortcut" readonly></label>`;
    case 'file':    return `<label class="f">${lab}<span><input ${b} value="${esc(v)}" placeholder="${esc(f.ph)}"><button class="btn sm" data-act="browse">Browse…</button></span></label>`;
    default:        return `<label class="f">${lab}<input ${b} value="${esc(v)}" placeholder="${esc(f.ph||'')}"></label>`;
  }
}
const actionSelect = (path, cur) => {
  const groups = {};
  for (const [k, a] of Object.entries(ACTIONS)) (groups[a.g] ||= []).push(`<option value="${k}" ${k===cur?'selected':''}>${esc(a.l)}${a.idea?' (suggested)':''}</option>`);
  return `<label class="f"><span>Action</span><select data-bind="${path}" data-retype>${Object.entries(groups).map(([g, o]) => `<optgroup label="${g}">${o.join('')}</optgroup>`).join('')}</select></label>`;
};
const summary = a => {
  if (!a || a.type === 'none') return '';
  if (a.entity) return a.entity.split('.')[1]?.replace(/_/g, ' ') || '';
  if (a.type === 'launch') return (a.path || '').split(/[\\/]/).pop();
  if (a.type === 'hotkey') return a.keys || '';
  if (a.type === 'media') return ACTIONS.media.f[0].opts[a.cmd] || '';
  return ACTIONS[a.type]?.l || '';
};

/* ---------- views ---------- */
const NAV = [['profiles','Profiles'],['ha','Home Assistant'],['device','Keypad'],['settings','Settings'],['spec','How it works']];
function renderSide() {
  $('#nav').innerHTML = NAV.map(([k, l]) => `<button data-view="${k}" aria-current="${view===k}">${l}</button>`).join('');
  $('#plist').innerHTML = S.profiles.map((p, i) => `<li class="${p.id===S.active?'on':''}">
    <button class="pick" data-pick="${p.id}"><span class="swatch" style="background:${esc(p.color)}"></span><span class="name">${esc(p.name)}</span>${p.id===S.active?'<span class="live">active</span>':''}</button>
    <button class="icon" data-move="${i},-1" aria-label="Move ${esc(p.name)} up" ${i?'':'disabled'}>▲</button>
    <button class="icon" data-move="${i},1" aria-label="Move ${esc(p.name)} down" ${i<S.profiles.length-1?'':'disabled'}>▼</button></li>`).join('');
}

function padHTML(p) {
  const s = sim[p.id] ?? 50, k = KNOB[p.knob.type];
  return `<div class="pad" style="--glow:${p.led==='off'?'transparent':esc(p.color)}">
    <div class="pad-body">
      ${p.keys.map((kk, i) => `<button class="key" data-key="${i}" aria-pressed="${sel.kind==='key'&&sel.i===i}" style="grid-column:${i%3+1};grid-row:${(i/3|0)+1}">
        <b>${esc(kk.label || summary(kk.tap) || 'Key '+(i+1))}</b><small>${kk.hold.type!=='none'?'+ hold':''}</small></button>`).join('')}
      <div class="knob-wrap">
        <button class="knob" data-knob aria-pressed="${sel.kind==='knob'}" aria-label="Knob: click to edit, scroll to turn" style="--rot:${(s*2.7-135)}deg"></button>
        <div class="turn"><button data-turn="-1" aria-label="Turn knob left">⟲</button><button data-press aria-label="Press knob">press</button><button data-turn="1" aria-label="Turn knob right">⟳</button></div>
      </div>
    </div>
    <div class="readout">${esc(k.sim)}: ${s}%</div>
    <div class="meter"><i style="width:${s}%"></i></div>
    <p class="hint">Click a key or the knob to edit it. Scroll over the knob or use ⟲ ⟳ to try the turn settings, and <b>press</b> to switch profile, the same as on the real keypad.</p>
  </div>`;
}

function inspectorHTML(p) {
  if (sel.kind === 'knob') {
    const k = KNOB[p.knob.type];
    return `<div class="card"><h2>Knob</h2><div class="fields">
      <label class="f"><span>Turning controls</span><select data-bind="knob.type" data-retype>${Object.entries(KNOB).map(([v, o]) => `<option value="${v}" ${v===p.knob.type?'selected':''}>${esc(o.l)}${o.idea?' (suggested)':''}</option>`).join('')}</select></label>
      ${(k.f||[]).map(f => field(f, 'knob')).join('')}
      ${field({k:'step', l:'Strength (change per step)', t:'range', min:1, max:k.max, unit:k.unit}, 'knob')}
      ${field({k:'sens', l:'Sensitivity', t:'select', opts:{1:'Every click of the knob', 2:'Every 2 clicks', 3:'Every 3 clicks'}}, 'knob')}
      ${field({k:'accel', l:'Speed up when turned fast', t:'bool'}, 'knob')}
      ${field({k:'invert', l:'Reverse direction', t:'bool'}, 'knob')}
      <p class="note">Pressing the knob switches to the next profile in every profile. Change press behaviour in <a href="#" data-view="settings">Settings</a>.</p>
    </div></div>`;
  }
  const kk = p.keys[sel.i], a = kk[tab], base = `keys.${sel.i}.${tab}`;
  return `<div class="card"><h2>Key ${sel.i + 1}</h2><div class="fields">
    <label class="f"><span>Label</span><input data-bind="keys.${sel.i}.label" value="${esc(kk.label)}" placeholder="${esc(summary(kk.tap) || 'Name shown here')}"></label>
    <div class="tabs" role="tablist"><button role="tab" data-tab="tap" aria-selected="${tab==='tap'}">Press</button><button role="tab" data-tab="hold" aria-selected="${tab==='hold'}">Hold${ideaTag(1)}</button></div>
    ${actionSelect(base + '.type', a.type)}
    ${ACTIONS[a.type].f.map(f => field(f, base)).join('')}
    ${a.type!=='none' ? `<div><button class="btn" data-act="test">Run now</button></div>` : ''}
    ${tab==='hold' ? '<p class="note">Hold = keep the key down for half a second. Leave it on "Do nothing" to keep presses instant.</p>' : ''}
  </div></div>`;
}

function viewProfiles() {
  const p = P();
  $('#main').innerHTML = `
    <div class="card"><div class="head">
      <label class="f"><span>Profile name</span><input data-bind="name" value="${esc(p.name)}"></label>
      <label class="f"><span>Keypad light</span><input type="color" data-bind="color" value="${esc(p.color)}"></label>
      <label class="f"><span>Light effect</span><select data-bind="led">${Object.entries(LED_MODES).map(([k, l]) => `<option value="${k}" ${k===p.led?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f"><span>Switch to this when using${ideaTag(1)}</span><input data-bind="apps" value="${esc(p.apps)}" placeholder="e.g. Photoshop.exe, Spotify.exe"></label>
      <button class="btn danger" data-act="delProfile" ${S.profiles.length<2?'disabled':''}>Delete</button>
    </div>
    <label class="check" style="margin-top:8px"><input type="checkbox" data-bind="stateLeds" ${p.stateLeds?'checked':''}><span><b>Keys light up to show what is on${ideaTag(1)}</b><small>A key's light follows its Home Assistant device, so you can see if the lamp is on without looking at it.</small></span></label>
    </div>
    <div class="grid2"><div>${padHTML(p)}</div><div id="insp">${inspectorHTML(p)}</div></div>`;
}

function viewHA() {
  $('#main').innerHTML = `<h1>Home Assistant</h1><p class="sub">The app talks to Home Assistant directly over its API, so HASS.Agent is not needed for the keypad.</p>
    <div class="card"><div class="fields" style="max-width:520px">
      <label class="f"><span>Home Assistant address</span><input type="url" data-gbind="ha.url" value="${esc(S.ha.url)}"></label>
      <label class="f"><span>Long-lived access token</span><input type="password" data-gbind="ha.token" value="${esc(S.ha.token)}" placeholder="Paste token" autocomplete="off"></label>
      <p class="note">In Home Assistant: click your name (bottom left) → Security → Long-lived access tokens → Create token. The app keeps it in Windows Credential Manager, not in the config file.</p>
      <div class="row"><button class="btn primary" data-act="testHA">Test connection</button><span class="readout" id="haStatus"></span></div>
    </div></div>
    <div class="card"><h2>Entities</h2><p class="sub" style="margin:0">After connecting, the app loads your lights, scenes, scripts and automations so the pickers suggest real names. This prototype uses example names.</p></div>`;
}

function viewDevice() {
  $('#main').innerHTML = `<h1>Keypad</h1><p class="sub">The keypad itself is programmed once. After that, everything on the Profiles page is handled by this app and changes take effect instantly.</p>
    <div class="card"><h2>One-time setup</h2>
      <table><thead><tr><th>Control</th><th>Sends</th></tr></thead><tbody>
        ${['Key 1','Key 2','Key 3','Key 4','Key 5','Key 6','Knob press','Knob turn right','Knob turn left'].map((c, i) => `<tr><td>${c}</td><td><kbd>${KEYMAP[i].split(' ')[0]}</kbd></td></tr>`).join('')}
      </tbody></table>
      <p class="note" style="margin-top:12px">F13 to F21 exist on no normal keyboard, so they never clash with your typing. Without this app running, the keypad does nothing.</p>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-act="program">Program keypad</button><button class="btn" data-act="restore">Restore original keys</button></div>
    </div>
    <div class="card"><h2>Lights</h2><div class="fields" style="max-width:420px">
      <label class="f"><span>Brightness: <output>${S.settings.ledBrightness}/4</output></span><input type="range" min="0" max="4" data-gbind="settings.ledBrightness" data-unit="/4" value="${S.settings.ledBrightness}"></label>
      <p class="note">Each profile sets its own colour and effect; this is the overall brightness.</p></div></div>
    <div class="card"><h2>Device</h2><table><tbody>
      <tr><td>Model</td><td>HCY-K006 (6 keys + knob)</td></tr><tr><td>USB ID</td><td>0816:246f</td></tr>
      <tr><td>Connection</td><td>Windows HID, no driver needed</td></tr><tr><td>Firmware</td><td>read from device</td></tr></tbody></table></div>`;
}

const SETTINGS = [
  ['startup', 'Start with Windows', 'Runs quietly in the system tray.'],
  ['osd', 'Show profile name on screen when switching', 'A small popup, like the one in this prototype.'],
  ['dblPrev', 'Double-press knob: previous profile', 'Makes single presses about 0.3 s slower, because the app waits to see if a second press follows.', 1],
  ['autoSwitch', 'Switch profile automatically by app', 'Uses the "Switch to this when using" list on each profile.', 1],
  ['flash', 'Flash the keypad light when an action runs', 'Red flash if it failed, such as Home Assistant being offline.', 1],
  ['sleepLocked', 'Turn keypad lights off when the PC is locked', '', 1],
];
function viewSettings() {
  $('#main').innerHTML = `<h1>Settings</h1><p class="sub">How the app behaves in the background.</p>
    <div class="card">${SETTINGS.map(([k, l, d, i]) => `<label class="check"><input type="checkbox" data-gbind="settings.${k}" ${S.settings[k]?'checked':''}><span><b>${l}${ideaTag(i)}</b><small>${d}</small></span></label>`).join('')}
      <label class="f" style="max-width:360px;margin-top:8px"><span>Hold knob down${ideaTag(1)}</span><select data-gbind="settings.longPress">
        ${Object.entries({none:'Nothing', picker:'Show profile list, turn to choose', mute:'Mute speakers', mic:'Mute microphone'}).map(([k, l]) => `<option value="${k}" ${S.settings.longPress===k?'selected':''}>${l}</option>`).join('')}
      </select></label>
    </div>
    <div class="card"><h2>Backup</h2><div class="row"><button class="btn" data-act="export">Show config file</button><button class="btn danger" data-act="reset">Reset prototype</button></div></div>`;
}

function viewSpec() {
  $('#main').innerHTML = `<h1>How it works</h1><p class="sub">What the finished desktop app consists of, so this page can serve as its spec.</p>
    <div class="card"><h2>Flow</h2><ol class="flow">
      <li><b>Keypad</b> is programmed once (Keypad page) so each key and knob movement sends one of F13 to F21.</li>
      <li><b>Background app</b> (tray icon) catches those keys, so they never reach other programs.</li>
      <li>It looks up the <b>active profile</b> and runs that key's action: a Home Assistant API call, launching a program, changing volume, and so on.</li>
      <li><b>Knob press</b> moves to the next profile. The app sets the keypad light to that profile's colour and shows the name on screen.</li>
      <li>This <b>settings window</b> edits one config file; the background app reloads it on save.</li>
    </ol></div>
    <div class="card"><h2>Parts to build</h2><table><thead><tr><th>Part</th><th>Job</th></tr></thead><tbody>
      <tr><td>Keypad driver</td><td>Programs F13 to F21 and sets lights (the Windows port of sdcx-keypad, already working)</td></tr>
      <tr><td>Key listener</td><td>Catches F13 to F21 system-wide and tracks press, hold and double-press</td></tr>
      <tr><td>Action runner</td><td>Home Assistant REST calls, Windows volume, launching apps, sending keys, commands</td></tr>
      <tr><td>Profile manager</td><td>Active profile, cycling, auto-switch by app, keypad light colour</td></tr>
      <tr><td>Tray icon</td><td>Open settings, pause, pick a profile, quit</td></tr>
      <tr><td>Settings window</td><td>This page</td></tr>
      <tr><td>Installer</td><td>Single .exe, start-with-Windows option</td></tr>
    </tbody></table></div>
    <div class="card"><h2>Suggested extras</h2><p class="sub" style="margin:0">Marked <span class="idea">suggested</span> throughout the app. Turn off the ones you don't want; your choices are included in the config file.</p>
      ${[['hold','Hold action per key','A second action on each key (press = toggle lamp, hold = all lights off).'],
         ['state','Key lights show device state','A key glows while its Home Assistant light or switch is on.'],
         ['auto','Auto-switch profile by app','PC profile while gaming, editing profile in Premiere.'],
         ['appvol','Per-app volume on the knob','Turn Spotify down without touching game volume.'],
         ['warmth','Light warmth and speaker volume on the knob','More knob targets for Home Assistant.'],
         ['picker','Hold knob to pick a profile','Hold, turn to choose, release, instead of cycling through all profiles.'],
         ['audio','Switch audio output','One key toggles between speakers and headphones.'],
         ['timer','Focus timer','Key starts a countdown, and the keypad light shows progress.'],
         ['flash','Feedback flash','Keypad flashes on success and red on failure.'],
         ['lock','Lights off when locked','Saves the LEDs and avoids glow at night.']]
        .map(([k, l, d]) => `<label class="check"><input type="checkbox" data-gbind="ideas.${k}" ${S.ideas[k]!==false?'checked':''}><span><b>${l}</b><small>${d}</small></span></label>`).join('')}
    </div>`;
}

function render() {
  renderSide();
  ({profiles:viewProfiles, ha:viewHA, device:viewDevice, settings:viewSettings, spec:viewSpec})[view]();
  save();
}
const refreshPad = () => { const p = P(), pad = document.querySelector('.pad'); if (pad) pad.outerHTML = padHTML(p); renderSide(); save(); };

/* ---------- knob simulation ---------- */
let clicks = 0;
function turn(dir) {
  const p = P(), k = p.knob; if (k.invert) dir = -dir;
  if (++clicks % (+k.sens || 1)) return;
  sim[p.id] = Math.max(0, Math.min(100, (sim[p.id] ?? 50) + dir * k.step));
  refreshPad();
}
function pressKnob() {
  const i = S.profiles.findIndex(p => p.id === S.active);
  S.active = S.profiles[(i + 1) % S.profiles.length].id;
  if (sel.kind === 'key') sel.i = Math.min(sel.i, 5);
  render(); osd(P());
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-pick],[data-move],[data-key],[data-knob],[data-turn],[data-press],[data-tab],[data-act]');
  if (!t) return;
  const d = t.dataset;
  if (d.view) { e.preventDefault(); view = d.view; render(); }
  else if (d.pick) { S.active = d.pick; view = 'profiles'; render(); osd(P()); }
  else if (d.move) { const [i, dir] = d.move.split(',').map(Number), a = S.profiles; [a[i], a[i+dir]] = [a[i+dir], a[i]]; render(); }
  else if (d.key) { sel = {kind:'key', i:+d.key}; tab = 'tap'; render(); }
  else if ('knob' in d) { sel = {kind:'knob'}; render(); }
  else if (d.turn) turn(+d.turn);
  else if ('press' in d) pressKnob();
  else if (d.tab) { tab = d.tab; render(); }
  else if (d.act) ACTS[d.act]?.(t);
});
document.addEventListener('wheel', e => { if (e.target.closest('[data-knob]')) { e.preventDefault(); turn(e.deltaY < 0 ? 1 : -1); } }, {passive:false});

function bindValue(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'range') return +el.value;
  return el.value;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.type === 'range') { const o = el.closest('label')?.querySelector('output'); if (o) o.textContent = el.value + (el.dataset.unit || ''); }
  if (el.dataset.bind && !('retype' in el.dataset)) { setPath(P(), el.dataset.bind, bindValue(el)); refreshPad(); }
  if (el.dataset.gbind) { setPath(S, el.dataset.gbind, bindValue(el)); save(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if ('retype' in el.dataset) {
    const path = el.dataset.bind.replace(/\.type$/, ''), def = el.dataset.bind.startsWith('knob') ? KNOB : ACTIONS;
    const old = getPath(P(), path), next = {type: el.value};
    if (old.entity) next.entity = old.entity;
    if (def === KNOB) Object.assign(next, {step: Math.min(old.step || 5, KNOB[el.value].max), sens: old.sens || 1, accel: !!old.accel, invert: !!old.invert});
    for (const f of (def[el.value].f || [])) if (f.d !== undefined && next[f.k] === undefined) next[f.k] = f.d;
    setPath(P(), path, next); render();
  }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (!('capture' in (el.dataset || {}))) return;
  if (e.key === 'Tab') return;
  e.preventDefault();
  if (['Control','Shift','Alt','Meta'].includes(e.key)) return;
  if (e.key === 'Backspace' || e.key === 'Delete') { el.value = ''; }
  else el.value = [e.ctrlKey&&'Ctrl', e.altKey&&'Alt', e.shiftKey&&'Shift', e.metaKey&&'Win', e.key.length === 1 ? e.key.toUpperCase() : e.key].filter(Boolean).join('+');
  setPath(P(), el.dataset.bind, el.value); refreshPad();
});

const ACTS = {
  addProfile() {
    const id = uid();
    S.profiles.push({id, name:'New profile', color:'#3ad29f', led:'steady', apps:'', stateLeds:false,
      knob:{type:'volume', step:2, sens:1, accel:true, invert:false}, keys:Array.from({length:6}, () => key('', {type:'none'}))});
    S.active = id; view = 'profiles'; sel = {kind:'key', i:0}; render();
  },
  delProfile() {
    const p = P(); if (!confirm(`Delete profile "${p.name}"?`)) return;
    S.profiles = S.profiles.filter(x => x.id !== p.id); S.active = S.profiles[0].id; render();
  },
  test() { const a = P().keys[sel.i][tab]; toast(`Prototype: the app would run "${ACTIONS[a.type].l}"${summary(a) ? ' → ' + summary(a) : ''}.`); },
  browse() { toast('In the app this opens the Windows file picker. Here, type or paste the path.'); },
  testHA() { $('#haStatus').textContent = S.ha.token ? 'Prototype: the app checks GET /api/ with this token and lists your entities.' : 'Paste a token first.'; },
  program() { toast('In the app: writes F13 to F21 to the keypad (sdcx keymap set …), after saving a backup.'); },
  restore() { toast('In the app: writes back keymap-backup.json (numpad 4,5,6, macro, 2,3, mute and volume knob).'); },
  export() {
    const d = $('#dlg');
    d.innerHTML = `<h2>config.json</h2><p class="sub" style="margin:0 0 10px">The file this window saves and the background app reads. The token is kept out of it.</p><pre>${esc(JSON.stringify({...S, ha:{url:S.ha.url}}, null, 2))}</pre><form method="dialog" class="row"><button class="btn primary">Close</button></form>`;
    d.showModal();
  },
  reset() { if (confirm('Reset all prototype data?')) { S = DEFAULT(); sel = {kind:'key', i:0}; render(); } },
};

render();
</script>
</body>
</html>
